name: Stage 12 audit

on:
  push:
    branches:
      - stage12-fix-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Stage 12 audit fixes
        if: github.event_name == 'push'
        run: node scripts/stage12-audit-fix.mjs

      - name: Syntax checks
        run: |
          node --check src/checks.mjs
          node --check src/attack-check.mjs
          node --check scripts/ops-record.mjs
          node --check scripts/ops-self-test.mjs
          node --check scripts/stage12-audit-fix.mjs
          node --check api/device/status.js
          node --check public/app.js

      - name: Stage 12 structure self-test
        run: npm run ops:self-test

      - name: Decider regression
        run: npm run decider:test

      - name: Detection regression
        run: npm run detect:test

      - name: Whitespace check
        run: git diff --check

      - name: Commit generated audit fixes
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo "No generated audit changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html README.md
          git commit -m "fix: 12단계 작전실 화면과 서버 증적 일치" \
            -m "- 브라우저 자체 점검 UUID와 자체 판정을 제거하고 ops-record 행을 표시" \
            -m "- 화면 설명과 README를 alephEvidence 기반 Production 기록 구조에 맞게 갱신"
          git push origin HEAD:stage12-fix-audit
