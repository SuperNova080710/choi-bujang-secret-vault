name: Stage 12 bundle merge fix

on:
  push:
    branches:
      - stage12-fix-bundle-merge

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage12-fix-bundle-merge
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply merge-commit bundle fix
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'scripts/bundle.mjs';
          const source = readFileSync(path, 'utf8');
          const before = "  const changedFiles = git('diff-tree', '--root', '--no-commit-id', '--name-only', '--no-renames', '-r', commit)\n    .split(/\\r?\\n/u).filter(Boolean).sort();";
          const after = "  const changedFiles = git('show', '--format=', '--name-only', '--no-renames', '--first-parent', commit)\n    .split(/\\r?\\n/u).filter(Boolean).sort();";

          if (!source.includes(before)) {
            throw new Error('bundle.mjs의 변경 파일 계산 구문을 찾지 못했습니다.');
          }

          writeFileSync(path, source.replace(before, after), 'utf8');
          NODE

      - name: Syntax and regression checks
        run: |
          node --check scripts/bundle.mjs
          npm run ops:self-test
          npm run decider:test
          npm run detect:test
          git diff --check

      - name: Verify merge commit changed-files behavior
        run: |
          test "$(git show --format= --name-only --no-renames --first-parent ed91b0bcca19b5fff7390b24e27e0a0cd8d87fde | sed '/^$/d')" = "ops/ops-record.json"

      - name: Commit bundle fix
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/bundle.mjs
          git commit -m "fix: merge commit에서도 제출 변경 파일 계산" \
            -m "- npm run bundle이 PR merge commit의 첫 부모 기준 변경 파일을 읽도록 수정" \
            -m "- 일반 커밋과 merge commit에서 동일하게 제출 묶음 변경 파일을 계산"
          git push origin HEAD:stage12-fix-bundle-merge
