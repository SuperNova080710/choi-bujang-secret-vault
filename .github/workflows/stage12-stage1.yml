name: Stage 12 Stage 1 evidence

on:
  push:
    branches:
      - stage12-stage1-evidence

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage12-stage1-evidence

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Stage 1 evidence fix
        run: node scripts/stage12-stage1-fix.mjs

      - name: Syntax checks
        run: |
          node --check src/attack-check.mjs
          node --check src/checks.mjs
          node --check scripts/ops-self-test.mjs
          node --check scripts/ops-record.mjs
          node --check scripts/bundle.mjs

      - name: Stage 12 structure self-test
        run: npm run ops:self-test

      - name: Decider regression
        run: npm run decider:test

      - name: Detection regression
        run: npm run detect:test

      - name: Whitespace check
        run: git diff --check

      - name: Commit Stage 1 evidence fix
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/attack-check.mjs src/checks.mjs scripts/ops-self-test.mjs README.md
          git commit -m "fix: 12단계 작전실 Stage 1 증적 추가" \
            -m "- 기존 공개 HTML GET을 Stage 1 공개 루트 증적으로 통합" \
            -m "- 직접 점검 20개 제한을 유지하며 Stage 1~12 전체 단계 표시를 검증"
          git push origin HEAD:stage12-stage1-evidence
