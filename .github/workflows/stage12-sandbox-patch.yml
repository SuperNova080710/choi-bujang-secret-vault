name: Stage 12 sandbox patch

on:
  push:
    branches:
      - stage12-fix-bundle-sandbox

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage12-fix-bundle-sandbox
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch attack-check for isolated bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'src/attack-check.mjs';
          let source = readFileSync(path, 'utf8');

          const fetchBefore = `      return fetch(\n        input,\n        {\n          ...init,\n\n          alephEvidence: {`;
          const fetchAfter = `      return fetch(\n        input,\n        {\n          ...init,\n          method: 'GET',\n\n          alephEvidence: {`;
          if (!source.includes(fetchBefore)) {
            throw new Error('evidenceFetch 구문을 찾지 못했습니다.');
          }
          source = source.replace(fetchBefore, fetchAfter);

          const publicBefore = `        {\n          headers: {\n            accept:\n              'application/json',\n          },`;
          const publicAfter = `        {\n          method:\n            'GET',\n\n          headers: {\n            accept:\n              'application/json',\n          },`;
          if (!source.includes(publicBefore)) {
            throw new Error('public-config fetch 구문을 찾지 못했습니다.');
          }
          source = source.replace(publicBefore, publicAfter);

          const restBefore = `    const restUrl = new URL(originalApi.pathname, originalApi.origin);\n    restUrl.searchParams.set('select', 'id');\n    restUrl.searchParams.set('limit', '1');`;
          const restAfter = `    const restUrl = new URL(\n      \`${'${originalApi.pathname}'}?select=id&limit=1\`,\n      originalApi.origin,\n    );`;
          if (!source.includes(restBefore)) {
            throw new Error('REST URL searchParams 구문을 찾지 못했습니다.');
          }
          source = source.replace(restBefore, restAfter);

          const cancelPattern = /\n\s*await\s+[A-Za-z][A-Za-z0-9]*\.body\s*\?\.\s*cancel\(\);/gu;
          const cancelMatches = source.match(cancelPattern) ?? [];
          if (cancelMatches.length !== 8) {
            throw new Error(`body.cancel 예상 8개, 실제 ${cancelMatches.length}개`);
          }
          source = source.replace(cancelPattern, '');

          if (/\.searchParams\./u.test(source)) {
            throw new Error('URL.searchParams 사용이 남아 있습니다.');
          }
          if (/\.body\s*\?\.\s*cancel/u.test(source)) {
            throw new Error('response.body.cancel 사용이 남아 있습니다.');
          }

          writeFileSync(path, source, 'utf8');
          NODE

      - name: Validate
        run: |
          node --check scripts/bundle.mjs
          node --check src/attack-check.mjs
          npm run ops:self-test
          git diff --check
          git diff -- src/attack-check.mjs scripts/bundle.mjs

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/attack-check.mjs
          git commit -m "fix: 12단계 격리 환경 GET 점검 단순화" \
            -m "- 제출 점검 요청을 GET으로 명시하고 URL.searchParams 사용 제거" \
            -m "- 응답 body.cancel 의존 제거로 격리 실행 경로 단순화"
          git push origin HEAD:stage12-fix-bundle-sandbox
