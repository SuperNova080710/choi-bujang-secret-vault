<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101a28;
      color: #ecf4ff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 44px 22px 64px;
    }

    .eyebrow {
      color: #8ad8df;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.2;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #bfd0e5;
    }

    .notice {
      margin: 26px 0;
      padding: 18px;
      border: 1px solid #d07384;
      border-radius: 14px;
      color: #ffe3e8;
      background: #612a3544;
    }

    .auth-card {
      margin: 26px 0;
      padding: 20px;
      border: 1px solid #51667c;
      border-radius: 14px;
      background: #162638;
    }

    .auth-status {
      margin: 0 0 16px;
      color: #bfd0e5;
      font-size: 15px;
    }

    .auth-form {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      color: #bfd0e5;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #51667c;
      border-radius: 9px;
      background: #0f1b2a;
      color: #ecf4ff;
      font: inherit;
    }

    button {
      padding: 11px 15px;
      border: 1px solid #8ad8df;
      border-radius: 9px;
      background: #173944;
      color: #ecf4ff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #1d4b58;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .logout-button {
      margin-top: 12px;
    }

    .error {
      margin: 12px 0 0;
      color: #ffb8c3;
      font-size: 14px;
    }

    .success {
      margin: 12px 0 0;
      color: #9ee5c2;
      font-size: 14px;
    }

    ul {
      list-style: none;
      display: grid;
      gap: 12px;
      padding: 0;
    }

    li {
      border: 1px solid #51667c;
      border-radius: 14px;
      padding: 17px 19px;
      background: #1a2a3d;
    }

    strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    li span {
      color: #bfd0e5;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 인증</div>
    <h1>점령된 자료실</h1>

    <p>
      Supabase Auth를 이용해 로그인 상태를 확인합니다.
      로그인 기능은 현재 단계의 인증 실습을 위한 것입니다.
    </p>

    <div class="auth-card">
      <h2>로그인</h2>
      <p id="auth-status" class="auth-status">로그인 상태를 확인하는 중입니다.</p>

      <form id="login-form" class="auth-form">
        <label>
          이메일
          <input id="email" name="email" type="email" autocomplete="email" required>
        </label>

        <label>
          비밀번호
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>

        <button id="login-button" type="submit">로그인</button>
      </form>

      <button id="logout-button" class="logout-button" type="button" hidden>
        로그아웃
      </button>

      <p id="auth-error" class="error" role="alert" hidden></p>
      <p id="auth-success" class="success" role="status" hidden></p>
    </div>

    <div class="notice">
      현재 3단계 제작 1에서는 로그인 화면만 추가했습니다.
      자료 API의 인증 보호는 다음 제작 단계에서 적용합니다.
    </div>

    <ul id="notes" aria-live="polite">
      <li>가상 자료를 불러오는 중입니다.</li>
    </ul>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://foynurtqnrgvsctcvbdr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_yMcUgSUjsfPx3xD51Z0Dpg_Hgp9_HW9';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const logoutButton = document.querySelector('#logout-button');
    const authStatus = document.querySelector('#auth-status');
    const authError = document.querySelector('#auth-error');
    const authSuccess = document.querySelector('#auth-success');

    function showError(message) {
      authError.textContent = message;
      authError.hidden = false;
      authSuccess.hidden = true;
    }

    function showSuccess(message) {
      authSuccess.textContent = message;
      authSuccess.hidden = false;
      authError.hidden = true;
    }

    function clearMessages() {
      authError.hidden = true;
      authSuccess.hidden = true;
      authError.textContent = '';
      authSuccess.textContent = '';
    }

    function updateAuthUI(user) {
      if (user) {
        authStatus.textContent = `로그인됨: ${user.email}`;
        loginForm.hidden = true;
        logoutButton.hidden = false;
      } else {
        authStatus.textContent = '로그인되지 않았습니다.';
        loginForm.hidden = false;
        logoutButton.hidden = true;
      }
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      clearMessages();

      loginButton.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      loginButton.disabled = false;

      if (error) {
        showError(`로그인 실패: ${error.message}`);
        return;
      }

      updateAuthUI(data.user);
      passwordInput.value = '';
      showSuccess('로그인되었습니다.');
    });

    logoutButton.addEventListener('click', async () => {
      clearMessages();
      logoutButton.disabled = true;

      const { error } = await supabase.auth.signOut();

      logoutButton.disabled = false;

      if (error) {
        showError(`로그아웃 실패: ${error.message}`);
        return;
      }

      updateAuthUI(null);
      showSuccess('로그아웃되었습니다.');
    });
    const {
      data: { session },
    } = await supabase.auth.getSession();

    updateAuthUI(session?.user ?? null);

    const list = document.querySelector('#notes');

    async function loadNotes() {
      try {
        const {
          data: { session },
        } = await supabase.auth.getSession();

        if (!session?.access_token) {
          list.replaceChildren();
          return;
        }

        const response = await fetch('/api/notes', {
          cache: 'no-store',
          headers: {
            Authorization: `Bearer ${session.access_token}`,
          },
        });

        if (!response.ok) {
          throw new Error('로그인 자료를 읽을 수 없습니다.');
        }

        const data = await response.json();

        if (!Array.isArray(data.notes)) {
          throw new Error('자료 형식이 맞지 않습니다.');
        }

        list.replaceChildren(
          ...data.notes.map(note => {
            const item = document.createElement('li');
            const title = document.createElement('strong');
            const content = document.createElement('span');

            title.textContent = note.title;
            content.textContent = note.content;

            item.append(title, content);
            return item;
          })
        );
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = error.message;
        list.replaceChildren(item);
      }
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      updateAuthUI(session?.user ?? null);
      void loadNotes();
    });

    await loadNotes();
  </script>
</body>

</html>
